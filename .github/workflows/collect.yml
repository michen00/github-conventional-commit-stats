---
name: Collect Conventional Commit Statistics

on:
  schedule:
    # Run monthly on the 1st at 4 AM UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:
  # Allow manual triggering

jobs:
  collect:
    name: Collect and Deploy Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max
    permissions:
      contents: write # To commit and push changes
      pages: write # To deploy to GitHub Pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Collect commit statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run conv-commit-stats collect --max-repos 1000 --min-stars 3
        continue-on-error: false

      - name: Export data
        run: |
          uv run conv-commit-stats export --output docs/data.json --run latest
        continue-on-error: false

      - name: Validate data integrity
        id: validate
        run: |
          uv run conv-commit-stats validate --run latest
        continue-on-error: false

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet docs/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: >
          steps.check-changes.outputs.changed == 'true' &&
          steps.validate.outcome == 'success'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/data.json data/
          git commit -m "chore(data): update conventional commit statistics"
          git push
        continue-on-error: false

      - name: Auto-revert on validation failure
        if: steps.validate.outcome == 'failure'
        run: |
          echo "Validation failed - reverting changes"
          git checkout HEAD -- docs/data.json data/
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "chore(data): revert invalid data collection" ||
            echo "No changes to revert"
          git push || echo "Nothing to push"
          exit 1

      - name: Deploy to GitHub Pages
        if: >
          steps.check-changes.outputs.changed == 'true' &&
          steps.validate.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
