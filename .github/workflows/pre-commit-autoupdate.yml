---
name: pre-commit autoupdate

on:
  schedule:
    - cron: "0 0 * * 1" # Run every Monday at 00:00
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  BRANCH_NAME: chore/pre-commit-autoupdate-workflow

jobs:
  pre-commit-autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          check-latest: true
          cache: pip
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit
      - name: Cache pre-commit hooks
        id: cache-pre-commit
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        env:
          CACHE_NUMBER: 0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}-${{ env.CACHE_NUMBER }} # yamllint disable-line rule:line-length
      - name: Install pre-commit hooks
        if: steps.cache-pre-commit.outputs.cache-hit != 'true'
        run: |
          pre-commit install
      - name: Update pre-commit hooks
        id: autoupdate-pre-commit
        run: |
          OUTPUT=$(pre-commit autoupdate || echo "autoupdate failed")
          echo "$OUTPUT"
          if [[ "$OUTPUT" == *"No updates available"* ]]; then
            exit 0
          fi
      - name: Test updated pre-commit hooks
        run: |
          if ! pre-commit run --all-files; then
            echo "Pre-commit hooks failed. Please review the log for details." >&2
            exit 1
          fi
      - name: Push changes and create PR
        # yamllint disable-line rule:line-length
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: "${{ env.BRANCH_NAME }}"
          sign-commits: true
          title: "chore: autoupdate pre-commit hooks"
          body: |
            This PR updates pre-commit hooks to their latest versions.
          commit-message: "chore(pre-commit): bump hook versions"
          delete-branch: true
          base: main
