---
name: Lint GitHub Actions workflows
permissions:
  contents: read
on:
  pull_request:
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check workflow files
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
