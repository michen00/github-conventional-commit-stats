[project]
dependencies = [
    "httpx>=0.27.0",
    "nox[uv]>=2025.10.14",
    "pandera[polars]>=0.25.0",
    "plotly>=6.3.1",
    "polars>=1.32.2",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.12.2",
    "pyyaml>=6.0.2",
    "rich-argparse>=1.7.1",
    "rich>=13.0.0",
    "structlog>=25.5.0",
    "tinydb>=4.8.0",
    "typer>=0.21.1",
    "yapic-json>=1.9.5",
]
name = "github-conventional-commit-stats"
version = "0.0.0"
description = "Conventional Commit Census — GitHub commit type frequency analysis"
readme = "README.md"
authors = [{ name = "Michael I Chen", email = "michael.chen.0@gmail.com" }]
requires-python = ">=3.12"

[project.scripts]
conv-commit-stats = "conv_commit_stats.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip>=25.3",
    "pre-commit>=4.5.1",
    "prek>=0.2.8",
    "pylint>=4.0.4",
    "ruff>=0.14.11",
]
test = ["coverage>=7.9.2", "pytest>=8.4.0", "pytest-cov>=6.2.1", "pytest-xdist>=3.8.0", "respx>=0.22.0"]

[tool.uv]
default-groups = []
package        = true

[tool.mypy]
allow_redefinition = true
disable_error_code = ["import-untyped"]
disallow_subclassing_any = false
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
exclude = '''(?x)(
    notebooks/     # exclude all files in the notebooks directory
    | tests/       # tests are runtime-checked via pytest; skip mypy here
    | \.ipynb$     # or files ending with ".ipynb"
)'''
local_partial_types = true
mypy_path = "src"
pretty = true
show_column_numbers = true
show_error_code_links = true
strict = true
warn_return_any = true
warn_unreachable = true

[[tool.uv.index]]
name        = "testpypi"
url         = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit    = true

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=conv_commit_stats",
    "--cov-report=term-missing",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]
log_cli_level = "INFO"
markers = [
    "no_ci: marks tests that should not run in CI (deselect with '-m \"not no_ci\"')",
]
minversion = "8.2"
testpaths = ["tests"]
xfail_strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/conv_commit_stats"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
